name: IndexNow - Submit URLs to Search Engines

# IndexNow previent Bing et Yandex qu'une page a change. Google ne l'utilise
# pas : cote Google, la decouverte passe par le sitemap declare dans la
# Search Console.
#
# Le declencheur ne regardait que sitemap.xml. Trois lots ont modifie une
# centaine de pages sans y toucher : les moteurs n'ont jamais ete prevenus.
# Il regarde desormais le contenu lui-meme.
on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "sitemap.xml"
  # Filet de securite hebdomadaire, si un changement passait entre les mailles.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: "Optional single URL to submit"
        required: false
        type: string

# Un push suit souvent le precedent de pres : inutile de soumettre deux fois.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Wait for Vercel deployment
        run: sleep 45

      - name: Submit to IndexNow
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            python3 -m scripts.seo.indexnow "${{ inputs.url }}"
          else
            python3 -m scripts.seo.indexnow
          fi
