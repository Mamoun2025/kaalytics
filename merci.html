    <style>
        .thanks-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-void);
            position: relative;
            overflow: hidden;
        }

        .thanks-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(13, 148, 136, 0.12) 0%, transparent 50%);
        }

        .thanks-page__grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.6;
        }

        .thanks-page__content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: var(--space-2xl);
            max-width: 640px;
        }

        .thanks-page__icon {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--space-xl);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(13, 148, 136, 0.15) 100%);
            border: 2px solid rgba(16, 185, 129, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2.5s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(16, 185, 129, 0.3);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(16, 185, 129, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 80px rgba(16, 185, 129, 0.5);
            }
        }

        .thanks-page__icon svg {
            width: 60px;
            height: 60px;
            color: var(--emerald);
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 1.2s ease-out 0.3s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        .thanks-page__title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: var(--space-lg);
            background: linear-gradient(135deg, var(--emerald) 0%, var(--teal) 50%, var(--emerald-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .thanks-page__subtitle {
            font-size: var(--text-xl);
            color: var(--text-primary);
            margin-bottom: var(--space-md);
            font-weight: 600;
        }

        .thanks-page__text {
            font-size: var(--text-lg);
            color: var(--text-secondary);
            margin-bottom: var(--space-2xl);
            line-height: var(--leading-relaxed);
        }

        .thanks-page__highlight {
            color: var(--emerald);
            font-weight: 600;
        }

        .thanks-page__actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            justify-content: center;
            margin-bottom: var(--space-3xl);
        }

        .thanks-page__next {
            margin-top: var(--space-3xl);
            padding-top: var(--space-xl);
            border-top: 1px solid var(--border-subtle);
        }

        .thanks-page__next-title {
            font-size: var(--text-sm);
            color: var(--text-muted);
            margin-bottom: var(--space-lg);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .thanks-page__next-grid {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            justify-content: center;
        }

        .thanks-page__link {
            padding: var(--space-sm) var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all var(--transition-fast);
        }

        .thanks-page__link:hover {
            border-color: var(--emerald);
            color: var(--emerald);
            transform: translateY(-2px);
        }

        /* Orbs */
        .thanks-page__orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
        }

        .thanks-page__orb--1 {
            width: 320px;
            height: 320px;
            background: var(--emerald);
            top: 10%;
            left: -10%;
        }

        .thanks-page__orb--2 {
            width: 240px;
            height: 240px;
            background: var(--teal);
            bottom: 10%;
            right: -5%;
        }

        /* Confetti dots */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            animation: confettiFall 4s ease-out forwards;
        }

        .confetti:nth-child(1) { left: 15%; background: var(--emerald); animation-delay: 0.3s; }
        .confetti:nth-child(2) { left: 30%; background: var(--teal); animation-delay: 0.5s; }
        .confetti:nth-child(3) { left: 45%; background: var(--emerald-light); animation-delay: 0.7s; }
        .confetti:nth-child(4) { left: 60%; background: var(--emerald); animation-delay: 0.4s; }
        .confetti:nth-child(5) { left: 75%; background: var(--teal); animation-delay: 0.6s; }
        .confetti:nth-child(6) { left: 88%; background: var(--emerald-light); animation-delay: 0.8s; }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(40vh) scale(1) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
